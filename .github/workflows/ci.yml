name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :warp:testDebugUnitTest :warp-vend:testDebugUnitTest

  snapshots:
    name: Verify snapshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Paparazzi snapshots
        run: ./gradlew verifyPaparazziDebug --continue

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failures
          path: '**/build/paparazzi/failures/'
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android Lint
        run: ./gradlew lintDebug --continue

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (minSdk) and newest
        include:
          - api-level: 24
          - api-level: '37.0'
            ram-size: 3072M

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner's preinstalled avdmanager writes target=android-0 for minor-versioned
      # packages (android-37.0), and surfaceflinger on that AVD crash-loops on colour buffer
      # reads. android-emulator-runner keeps whatever cmdline-tools the runner ships.
      - name: Update SDK cmdline-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          # sdkmanager won't overwrite the preinstalled dir, it installs to latest-2
          if [ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]; then
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi

      # Compile before the emulator starts so the two don't compete for CPU
      - name: Build test APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :warp:assembleDebugAndroidTest
          ./gradlew --stop

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: ${{ matrix.ram-size }}
          # Capture logcat from the first moment of boot, so a crash before the script runs is recorded
          pre-emulator-launch-script: nohup sh -c 'adb wait-for-device && adb logcat -v threadtime -b all' > logcat.txt 2>&1 &
          # Each line runs in its own shell
          script: |
            bash .github/scripts/wait-for-emulator.sh 300 30
            ./gradlew :app:connectedDebugAndroidTest :warp:connectedDebugAndroidTest --continue

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            logcat.txt
            **/build/reports/androidTests/connected/
          if-no-files-found: ignore
